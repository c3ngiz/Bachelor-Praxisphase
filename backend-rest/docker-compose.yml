services:
  postgres:
    image: postgres:17-alpine
    container_name: collabdocs-rest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-collabdocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collabdocs}
      POSTGRES_USER: ${POSTGRES_USER:-collabdocs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collabdocs} -d ${POSTGRES_DB:-collabdocs}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
