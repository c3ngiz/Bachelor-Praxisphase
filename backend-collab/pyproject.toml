[project]
name = "collabdocs-python-backend"
version = "0.2.0"
description = "FastAPI REST, GraphQL, and WebSocket backend for CollabDocs."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "bcrypt>=5.0,<6",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "strawberry-graphql[fastapi]>=0.250,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.8,<1",
  "websockets>=12,<15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
